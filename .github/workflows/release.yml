name: Windows release
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test application
        run: node --test
      - name: Test portable runtime setup
        shell: powershell
        run: ./scripts/start-windows.ps1 -SetupOnly
      - name: Package clean Windows ZIP
        shell: pwsh
        run: ./scripts/package-release.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; update package.json for a new release." }
          gh release create $tag "dist/proFILEr-v$version-windows.zip" "dist/proFILEr-v$version-windows.zip.sha256" --target $env:RELEASE_COMMIT --title "proFILEr $tag" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
